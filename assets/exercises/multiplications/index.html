<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tables de multiplication</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- EN-TÊTE -->
  <header class="exercise-header">
    <div class="exercise-header__icon" aria-hidden="true">✖️</div>
    <h1 class="exercise-header__title">Tables de multiplication</h1>
  </header>

  <!-- ============================================================
       ÉCRAN DE SÉLECTION DU NIVEAU
       ============================================================ -->
  <section id="level-screen" class="level-screen">
    <p class="level-screen__subtitle">Choisis ton niveau</p>
    <div id="level-timer-wrap" class="timer-wrap level-timer-wrap"
         role="timer" aria-live="polite"
         aria-label="Temps restant pour choisir un niveau">
      <div id="level-timer-bar-track" class="timer-bar-track">
        <div id="level-timer-bar" class="timer-bar"></div>
      </div>
      <span id="level-timer-label" class="timer-label timer-label--mmss">2:00</span>
    </div>
    <div class="level-grid">
      <button class="level-btn" data-level="easy">
        <span class="level-btn__emoji">🌱</span>
        <span class="level-btn__label">Débutant</span>
        <span class="level-btn__desc">Tables de 2 à 5</span>
      </button>
      <button class="level-btn" data-level="medium">
        <span class="level-btn__emoji">🔥</span>
        <span class="level-btn__label">Intermédiaire</span>
        <span class="level-btn__desc">Tables de 2 à 10</span>
      </button>
      <button class="level-btn" data-level="hard">
        <span class="level-btn__emoji">⚡</span>
        <span class="level-btn__label">Difficile</span>
        <span class="level-btn__desc">Tables de 6 à 12</span>
      </button>
    </div>
  </section>

  <!-- ============================================================
       BARRE DE PROGRESSION
       ============================================================ -->
  <div id="progress-wrap" class="progress-wrap" style="display:none">
    <div class="progress-track" role="progressbar"
         aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progress-fill" class="progress-fill"></div>
    </div>
    <p id="progress-label" class="progress-label" aria-live="polite">1 / 10</p>
  </div>

  <!-- ============================================================
       SECTION QUESTION
       ============================================================ -->
  <section id="question-section" style="display:none">

    <!-- Chronomètre -->
    <div class="timer-wrap" aria-hidden="true">
      <div id="timer-bar-track" class="timer-bar-track">
        <div id="timer-bar" class="timer-bar"></div>
      </div>
      <span id="timer-label" class="timer-label">5</span>
    </div>

    <!-- Carte question -->
    <div class="card">
      <p class="card__label">Combien font…</p>
      <p id="question-text" class="question-text" aria-live="polite">…</p>
    </div>

    <!-- Carte réponse -->
    <div class="card">
      <p class="card__label">Ta réponse</p>
      <div id="answer-section"></div>
      <p id="feedback" class="feedback feedback--empty"
         role="status" aria-live="assertive"></p>
    </div>

  </section>

  <!-- ============================================================
       ÉCRAN DE RÉSULTAT
       ============================================================ -->
  <section id="result-screen" class="result-screen" aria-live="polite">
    <p id="result-emoji"  class="result-emoji"  aria-hidden="true">🎉</p>
    <p id="result-title"  class="result-title">Excellent travail !</p>
    <p id="result-score"  class="result-score">0 / 10</p>
    <p id="result-detail" class="result-detail"></p>
    <button id="btn-restart"  class="btn-restart"  type="button">🔄 Rejouer</button>
    <button id="btn-levels"   class="btn-levels"   type="button">📋 Changer de niveau</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
